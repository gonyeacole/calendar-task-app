<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230d1013%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%278%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Calendar</title>
  <script>try{var t=localStorage.getItem("calendar-task-app:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preload" href="fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Syncopate-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Syncopate-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Home-screen (standalone) mode on iOS: make the document as tall as the screen. Runs before first paint; see app.js.
    window.fitScreen = function () {
      var standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
      var gap = screen.height - innerHeight;
      var on = standalone && innerWidth < innerHeight && gap >= 0 && gap <= 120;
      var root = document.documentElement;
      root.classList.toggle("tall-screen", on);
      root.style.setProperty("--app-h", on ? screen.height + "px" : "");
    };
    window.fitScreen();
  </script>
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="tabs"></nav>
  </div>
  <div id="sheet-root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
