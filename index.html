<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ead8">
  <meta name="calendar-sync" content="on">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    // Shared calendar: if this phone has no code yet, hide the app from the very first frame so the code screen is all you see (app.js adds the screen itself).
    try { if (document.querySelector('meta[name="calendar-sync"]') && !localStorage.getItem("calendar-task-app:code") && sessionStorage.getItem("calendar-task-app:guest") !== "1") document.documentElement.classList.add("locked"); } catch (e) {}
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="(k)cal">
  <link rel="manifest" href="manifest.webmanifest">
  <title>(k)cal</title>
  <script>document.documentElement.dataset.theme="light";try{var t=localStorage.getItem("calendar-task-app:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preload" href="fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Syncopate-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Syncopate-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Home-screen (standalone) mode on iOS: make the document as tall as the screen. Runs before first paint; see app.js.
    window.fitScreen = function () {
      var standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
      var gap = screen.height - innerHeight;
      var on = standalone && innerWidth < innerHeight && gap >= 0 && gap <= 120;
      var root = document.documentElement;
      root.classList.toggle("tall-screen", on);
      root.style.setProperty("--app-h", on ? screen.height + "px" : "");
    };
    window.fitScreen();
  </script>
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="tabs"></nav>
  </div>
  <div id="sheet-root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
